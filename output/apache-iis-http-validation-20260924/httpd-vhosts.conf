# HTTP entry point for the Laravel application.
# The matching Listen 80 directive is in httpd.conf.
<VirtualHost 127.0.0.1:18080>
    # IIS receives public HTTP on port 80 and proxies to this loopback listener.
    ServerName http://10.142.0.15:80
    UseCanonicalName On
    UseCanonicalPhysicalPort Off
    DocumentRoot "D:/hotrobieumau/output/apache-iis-http-validation-20260924/public"

    # Supply the public origin to PHP without changing global ARR host settings.
    RequestHeader set Host "10.142.0.15"
    RequestHeader unset Forwarded
    RequestHeader set X-Forwarded-Host "10.142.0.15"
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    <Directory "D:/hotrobieumau/output/apache-iis-http-validation-20260924/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require local
    </Directory>

    # IIS connects locally. Do not expose inherited XAMPP management aliases.
    <LocationMatch "(?i)^/(?:phpmyadmin|webalizer|xampp|php-cgi|cgi-bin|licenses|server-status|server-info)(?:/|$)">
        Require all denied
    </LocationMatch>

    ErrorLog "D:/hotrobieumau/output/apache-iis-http-validation-20260924/app-error.log"
    CustomLog "D:/hotrobieumau/output/apache-iis-http-validation-20260924/app-access.log" combined
</VirtualHost>
