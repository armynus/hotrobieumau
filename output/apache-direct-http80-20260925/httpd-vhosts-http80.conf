# Single application served directly by Apache, without IIS or HTTPS.
<VirtualHost *:80>
    ServerName 10.142.0.15:80
    DocumentRoot "D:/hotrobieumau/public"
    DirectoryIndex index.php index.html

    <Directory "D:/hotrobieumau/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Keep inherited XAMPP management endpoints out of this application site.
    <LocationMatch "(?i)^/(?:phpmyadmin|webalizer|xampp|php-cgi|cgi-bin|licenses|server-status|server-info)(?:/|$)">
        Require all denied
    </LocationMatch>

    ErrorLog "logs/hotrobieumau-http-error.log"
    CustomLog "logs/hotrobieumau-http-access.log" combined
</VirtualHost>
