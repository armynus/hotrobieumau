# HTTP entry point for the Laravel application.
# The matching Listen 80 directive is in httpd.conf.
<VirtualHost 127.0.0.1:18080>
    ServerName 10.142.0.15
    DocumentRoot "D:/hotrobieumau/public"

    <Directory "D:/hotrobieumau/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "D:/hotrobieumau/output/apache-http-recheck-20260924/runtime-vhost-error.log"
    CustomLog "D:/hotrobieumau/output/apache-http-recheck-20260924/runtime-vhost-access.log" combined
</VirtualHost>
