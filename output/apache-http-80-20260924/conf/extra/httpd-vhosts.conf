# HTTP entry point for the Laravel application.
# The matching Listen 80 directive is in httpd.conf.
<VirtualHost *:80>
    ServerName 10.142.0.15
    DocumentRoot "D:/hotrobieumau/public"

    <Directory "D:/hotrobieumau/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/hotrobieumau-http-error.log"
    CustomLog "logs/hotrobieumau-http-access.log" combined
</VirtualHost>
