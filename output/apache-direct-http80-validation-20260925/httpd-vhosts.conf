# Single application served directly by Apache, without IIS or HTTPS.
<VirtualHost *:18080>
    ServerName 10.142.0.15:80
    DocumentRoot "D:/hotrobieumau/output/apache-direct-http80-validation-20260925/public"
    DirectoryIndex index.php index.html

    <Directory "D:/hotrobieumau/output/apache-direct-http80-validation-20260925/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Keep inherited XAMPP management endpoints out of this application site.
    <LocationMatch "(?i)^/(?:phpmyadmin|webalizer|xampp|php-cgi|cgi-bin|licenses|server-status|server-info)(?:/|$)">
        Require all denied
    </LocationMatch>

    ErrorLog "D:/hotrobieumau/output/apache-direct-http80-validation-20260925/app-error.log"
    CustomLog "D:/hotrobieumau/output/apache-direct-http80-validation-20260925/app-access.log" combined
</VirtualHost>
